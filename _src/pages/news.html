<main id="main">
{{PAGE_HERO}}

  <!-- NEWS GRID (follows macplaitg news cards). Stories are in _src/content.mjs. -->
  <section class="section section--surface" aria-labelledby="newsroom-title">
    <div class="container">
      <h2 class="visually-hidden" id="newsroom-title">All stories</h2>
      <div class="section-head">
        <div class="filters" role="group" aria-label="Filter news by category" data-filter-group="#news-grid" data-filter-status="#news-count" data-filter-empty="#news-empty" data-filter-noun="stories">{{NEWS_FILTERS}}
        </div>
        <p class="filter-bar__count" id="news-count" role="status"></p>
      </div>
      <ul class="grid grid--news" id="news-grid">{{NEWS_ALL}}
      </ul>
      <p class="empty-state" id="news-empty" hidden>No stories in this category yet.</p>
    </div>
  </section>
</main>
